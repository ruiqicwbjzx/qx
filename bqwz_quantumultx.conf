[rewrite_local]
# --- 核心: 拦截游戏服务端 API 响应 ---

# 用户信息: 资源/等级/道具拉满
^https://prod-build-adventure\.lanfeitech\.com/api/user/get_user_info url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 武器列表: 攻击/生命/品质拉满
^https://prod-build-adventure\.lanfeitech\.com/api/weapon/get_weapons url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 武器道具
^https://prod-build-adventure\.lanfeitech\.com/api/weapon/get_weapon_props_info url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 扭蛋次数拉满
^https://prod-build-adventure\.lanfeitech\.com/api/activity/get_egg_info url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 充值记录伪造
^https://prod-build-adventure\.lanfeitech\.com/api/shop/get_total_recharge_info url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 订单创建 - 防报错
^https://prod-build-adventure\.lanfeitech\.com/api/order/create url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 订单验证 - 强制成功
^https://prod-build-adventure\.lanfeitech\.com/api/order/verify url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 挂起订单 - 清空列表
^https://prod-build-adventure\.lanfeitech\.com/api/order/hang_list url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 邮件
^https://prod-build-adventure\.lanfeitech\.com/api/mail/load$ url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 屏蔽数据追踪上报
^https://api\.datanexus\.qq\.com/data-nexus-trace/log url reject-dict

[mitm]
hostname = prod-build-adventure.lanfeitech.com, cdn-build-adventure.lanfeitech.com, game-admin.lanfeitech.com, api.datanexus.qq.com

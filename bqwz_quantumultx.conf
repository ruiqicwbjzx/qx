[rewrite_local]
# 核心: 拦截支付配置，所有商品价格改为 1 分
^https://cdn-build-adventure\.lanfeitech\.com/prodConfig/pay\.config url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 拦截游戏 JS，注入资源拉满/广告跳过/排行榜刷分 Hook
^https://servicewechat\.com/wxcfb0cdea6a581432/.+/game\.js$ url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js
^https://servicewechat\.com/wxcfb0cdea6a581432/.+/weapp-adapter\.js$ url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js
^https://servicewechat\.com/wxcfb0cdea6a581432/.+/dn-sdk-minigame/dn-sdk\.js$ url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 备用: 拦截 CDN JS
^https://cdn-build-adventure\.lanfeitech\.com/.+\.js$ url script-response-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 拦截数据上报，购买金额归零
^https://api\.datanexus\.qq\.com/data-nexus-cgi/miniprogram url script-request-body https://raw.githubusercontent.com/ruiqicwbjzx/qx/main/bqwz_hack.js

# 屏蔽无用追踪上报
^https://api\.datanexus\.qq\.com/data-nexus-trace/log url reject-dict

[mitm]
hostname = servicewechat.com, cdn-build-adventure.lanfeitech.com, api.datanexus.qq.com
